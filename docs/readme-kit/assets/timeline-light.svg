<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-label="The gateway so far: first paintings and an open API on 20 November, 1,000 Lambda calls at once and these docs on 21 November">
<title>The gateway so far: first paintings and an open API on 20 November, 1,000 Lambda calls at once and these docs on 21 November</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.prog{stroke-dasharray:980;stroke-dashoffset:0;animation:prog 2.4s cubic-bezier(.4,0,.2,1) .2s both}@keyframes prog{from{stroke-dashoffset:980}to{stroke-dashoffset:0}}.halo{animation:halo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}.ahead{stroke-dasharray:2 10}.r0{animation-delay:0.1s}.r1{animation-delay:0.3s}.r2{animation-delay:0.4s}.r3{animation-delay:0.6s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0"><stop offset="0" stop-color="#762CB1"/><stop offset="1" stop-color="#AA69E9"/></linearGradient>
</defs>
<path class="ahead" d="M70 112 H1130" stroke="#DCD7EE" stroke-width="3" stroke-linecap="round" fill="none"/>
<path class="prog" d="M110 112 H1090" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" fill="none"/>
<g class="rise r0">
<text x="110" y="82" class="m" fill="#762CB1" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">20 NOV</text>

<circle cx="110" cy="112" r="8" fill="#FFFFFF" stroke="#762CB1" stroke-width="3"/>
<text x="110" y="156" class="d" fill="#1E1B2E" font-size="16" font-weight="700" text-anchor="middle">First paintings</text>
<text x="110" y="179" class="s" fill="#615D7A" font-size="13" text-anchor="middle">Kangra and Mughal on fal.ai</text>
</g>
<g class="rise r1">
<text x="436.7" y="82" class="m" fill="#762CB1" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">20 NOV</text>

<circle cx="436.7" cy="112" r="8" fill="#FFFFFF" stroke="#762CB1" stroke-width="3"/>
<text x="436.7" y="156" class="d" fill="#1E1B2E" font-size="16" font-weight="700" text-anchor="middle">Open API</text>
<text x="436.7" y="179" class="s" fill="#615D7A" font-size="13" text-anchor="middle">No keys, one daily image limit</text>
</g>
<g class="rise r2">
<text x="763.3" y="82" class="m" fill="#762CB1" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">21 NOV</text>

<circle cx="763.3" cy="112" r="8" fill="#FFFFFF" stroke="#762CB1" stroke-width="3"/>
<text x="763.3" y="156" class="d" fill="#1E1B2E" font-size="16" font-weight="700" text-anchor="middle">1,000 at once</text>
<text x="763.3" y="179" class="s" fill="#615D7A" font-size="13" text-anchor="middle">Lambda concurrency raised</text>
</g>
<g class="rise r3">
<text x="1090" y="82" class="m" fill="#762CB1" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">21 NOV</text>
<circle class="halo" cx="1090" cy="112" r="10" fill="#762CB1"/>
<circle cx="1090" cy="112" r="10" fill="#762CB1" stroke="#762CB1" stroke-width="3"/>
<text x="1090" y="156" class="d" fill="#1E1B2E" font-size="16" font-weight="700" text-anchor="middle">Docs</text>
<text x="1090" y="179" class="s" fill="#615D7A" font-size="13" text-anchor="middle">README kit, reference in docs/</text>
</g>
</svg>
